AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Fauntleroy to Vashon School Commute Ferry Tracker.
  Automated Lambda function updating an S3 static site using WSDOT feeds and Gemini Flash.

Parameters:
  GeminiApiKey:
    Type: String
    NoEcho: true
    Description: Google Gemini Flash API Key for AI investigation.
    Default: ""
  GeminiModel:
    Type: String
    Default: "gemini-2.5-flash"
    Description: Gemini model variant to use.
  ScheduleCron:
    Type: String
    Default: "rate(4 minutes)"
    Description: EventBridge invocation schedule (e.g. rate(4 minutes)).

Resources:
  # S3 Bucket for Static Website Hosting
  FerryWebsiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "vashon-ferry-commute-${AWS::AccountId}"
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  # Bucket Policy allowing public read for static website
  FerryWebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FerryWebsiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PublicReadGetObject
            Effect: Allow
            Principal: '*'
            Action: 's3:GetObject'
            Resource: !Sub "${FerryWebsiteBucket.Arn}/*"

  # IAM Execution Role for Lambda Function
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "vashon-ferry-tracker-role-${AWS::Region}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: S3UploadAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 's3:PutObject'
                  - 's3:PutObjectAcl'
                  - 's3:GetObject'
                  - 's3:ListBucket'
                Resource:
                  - !Sub "${FerryWebsiteBucket.Arn}"
                  - !Sub "${FerryWebsiteBucket.Arn}/*"

  # AWS Lambda Function
  FerryTrackerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: "vashon-ferry-tracker"
      Description: "Fauntleroy-Vashon school commute ferry tracker and Gemini AI advisor"
      Runtime: python3.12
      Handler: src.lambda_handler.lambda_handler
      MemorySize: 256
      Timeout: 60
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          S3_BUCKET_NAME: !Ref FerryWebsiteBucket
          GEMINI_API_KEY: !Ref GeminiApiKey
          GEMINI_MODEL: !Ref GeminiModel
      Code:
        ZipFile: |
          def lambda_handler(event, context):
              return {"statusCode": 200, "body": "Placeholder. Deploy lambda_package.zip to activate."}

  # EventBridge Rule for Periodic Trigger
  ScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Name: "vashon-ferry-tracker-cron"
      Description: "Triggers ferry telemetry collector and AI analysis periodically"
      ScheduleExpression: !Ref ScheduleCron
      State: ENABLED
      Targets:
        - Arn: !GetAtt FerryTrackerFunction.Arn
          Id: FerryTrackerTarget

  # Permission for EventBridge to invoke Lambda
  EventBridgeInvokeLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref FerryTrackerFunction
      Action: 'lambda:InvokeFunction'
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ScheduleRule.Arn

Outputs:
  WebsiteURL:
    Description: "Public URL for the Vashon School Ferry Commute Tracker"
    Value: !GetAtt FerryWebsiteBucket.WebsiteURL
  BucketName:
    Description: "S3 Bucket Name"
    Value: !Ref FerryWebsiteBucket
  LambdaFunctionName:
    Description: "Lambda Function Name"
    Value: !Ref FerryTrackerFunction
  LambdaFunctionArn:
    Description: "Lambda Function ARN"
    Value: !GetAtt FerryTrackerFunction.Arn
